<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Игровые уроки английского для детей 9–10 лет с пуделем Винни: Present Simple и Continuous, there is / there are, артикли a / an / the, was / were и could. Озвучка, баллы, наклейки."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="English with Vincent" />
    <meta property="og:title" content="English with Vincent — игровые уроки английского для детей" />
    <meta
      property="og:description"
      content="Четыре озвученных урока с пуделем Винни: времена, there is / there are, артикли, was / were и could. Баллы, наклейки и медали за каждый урок."
    />
    <meta property="og:url" content="https://isalin84.github.io/english-with-vincent/" />
    <meta property="og:image" content="https://isalin84.github.io/english-with-vincent/public/assets/og-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Пудель Винни машет лапой, надпись English with Vincent" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="English with Vincent — игровые уроки английского для детей" />
    <meta name="twitter:description" content="Четыре озвученных урока с пуделем Винни: времена, there is / there are, артикли, was / were и could." />
    <meta name="twitter:image" content="https://isalin84.github.io/english-with-vincent/public/assets/og-preview.jpg" />
    <meta name="theme-color" content="#1747d1" />
    <title>English with Vincent — игровые уроки английского для детей</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231747d1'/%3E%3Cg fill='%23ffd85a'%3E%3Cellipse cx='32' cy='39' rx='15' ry='13'/%3E%3Ccircle cx='17' cy='23' r='7'/%3E%3Ccircle cx='30' cy='16' r='7'/%3E%3Ccircle cx='44' cy='19' r='7'/%3E%3Ccircle cx='51' cy='31' r='6'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preload" href="public/assets/vincent-teacher.webp" as="image" type="image/webp" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky-confetti" id="confetti" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="#" aria-label="English with Vincent — начать урок заново">
        <span class="brand-paw" aria-hidden="true">●</span>
        <span>English <em>with</em> Vincent</span>
      </a>
      <div class="player-strip" aria-label="Игровой прогресс">
        <div class="player-name" id="player-name-button" role="button" tabindex="0" aria-label="Изменить имя">
          <span aria-hidden="true">🎒</span> <span id="player-name">друг</span>
        </div>
        <div class="score-pill" aria-live="polite"><span aria-hidden="true">⭐</span> <b id="score">0</b></div>
        <div class="score-pill total-pill" aria-live="polite"><span aria-hidden="true">🏆</span> <b id="total-score">0</b></div>
        <button class="icon-button" id="sound-toggle" type="button" aria-label="Выключить звук" aria-pressed="true">
          <span aria-hidden="true">🔊</span>
        </button>
      </div>
    </header>

    <main class="lesson-shell">
      <nav class="trail" id="trail" aria-label="Этапы урока"></nav>

      <section class="game-board" aria-live="polite">
        <div class="vincent-stage">
          <div class="speech" id="speech-bubble">
            <p id="speech-text">Привет! Я Винни.</p>
            <button class="speak-button" id="speak-button" type="button" aria-label="Послушать Винни">
              <span aria-hidden="true">▶</span> Послушать
            </button>
          </div>
          <img
            id="vincent-image"
            class="vincent-image"
            src="public/assets/vincent-teacher.webp"
            alt="Винни — пудель-помощник"
            width="750"
            height="900"
          />
          <div class="vincent-tag"><b>Винни</b><span>твой проводник</span></div>
        </div>

        <div class="activity-panel" id="activity-panel"></div>
      </section>
    </main>

    <footer>
      <span>Сделано с любовью для юных учеников</span>
      <button id="reset-button" type="button">На карту</button>
    </footer>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
